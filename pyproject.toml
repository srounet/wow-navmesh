[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "wow-navmesh"
version = "1.0.1"
description = "Python bindings for Detour (recastnavigation) navmesh pathfinding over TrinityCore/AzerothCore mmaps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "srounet" }]
keywords = ["recastnavigation", "detour", "navmesh", "pathfinding", "trinitycore", "azerothcore", "wow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/srounet/wow-navmesh"
Repository = "https://github.com/srounet/wow-navmesh"
Issues = "https://github.com/srounet/wow-navmesh/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/wow_navmesh"]
cmake.build-type = "Release"
# Ship only the parts of recastnavigation this project compiles, plus its license
# (include takes precedence over exclude).
sdist.exclude = ["extern/recastnavigation/**"]
sdist.include = [
    "extern/recastnavigation/License.txt",
    "extern/recastnavigation/Detour/**",
    "extern/recastnavigation/DetourCrowd/**",
]

[tool.scikit-build.cmake.define]
WOW_NAVMESH_POLYREF64 = { env = "WOW_NAVMESH_POLYREF64", default = "ON" }

[tool.cibuildwheel]
build = "cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64 cp315-win_amd64"
# The installed wheel against the test suite; the tiers that need game data or nanobind skip.
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
